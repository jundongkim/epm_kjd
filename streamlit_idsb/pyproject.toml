[tool.poetry]
name = "sentients"
version = "0.1.0"
description = "Ontology-driven Vertical AI Agent"
authors = ["Kenny Jung <kenny.jung@sentients.tech>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fitz = "^0.0.1.dev2"
frontend = "^0.0.3"
tools = "^0.1.9"
pymupdf = "^1.25.3"
langchain-openai = "^0.3.7"
langchain-community = "^0.3.18"
huggingface-hub = "^0.29.1"
ipywidgets = "^8.1.5"
langchain = "^0.3.19"
sentence-transformers = "^3.4.1"
langchain-huggingface = "^0.1.2"
faiss-cpu = "^1.10.0"
streamlit = "^1.42.2"
python-dotenv = "^1.0.1"
pypdf = "^5.3.0"
langchain-cohere = "^0.4.2"
rdflib = "^7.1.3"
fpdf = "^1.7.2"
pandas = "^2.2.3"
matplotlib = "^3.10.1"
altair = "^5.5.0"
networkx = "^3.4.2"
pyvis = "^0.3.2"
plotly = "^6.0.0"
flask = "^3.1.0"
flask-cors = "^5.0.1"
requests = "^2.32.3"
pillow = "^11.1.0"
markdown = "^3.7"
numpy = "1.26.4"
catboost = "^1.2.7"
seaborn = "^0.13.2"
torch = "^2.6.0"
torchvision = "^0.21.0"
torchaudio = "^2.6.0"
torch-tb-profiler = "^0.4.3"
langchain-ollama = "^0.3.0"
tabulate = "^0.9.0"
wordcloud = "^1.9.4"
konlpy = "^0.6.0"
jpype1 = "^1.5.2"
pytesseract = "^0.3.13"
# macOS인 경우
xgboost = { version = "^3.0.0", markers = "sys_platform == 'darwin'" }
# macOS가 아닌 경우
xgboost-cpu = { version = "^3.0.0", markers = "sys_platform != 'darwin'" }
shap = "^0.47.1"
openpyxl = "^3.1.5"
opencv-python = "^4.11.0.86"
statsmodels = "^0.14.4"
tslearn = "^0.6.3"
pywavelets = "^1.8.0"
h5py = "^3.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
