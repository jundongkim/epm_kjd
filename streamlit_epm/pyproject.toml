[tool.poetry]
name = "manufacturing-copilot-prototype"
version = "1.0.0"
description = "DX-AI Manufacturing Copilot - 스마트 제조 공정 관리 AI 솔루션 프로토타입"
authors = ["DX-AI Manufacturing Copilot Team <support@manufacturing-copilot.com>"]
readme = "README.md"
packages = [{include = "ecopro_prototype"}]

[tool.poetry.dependencies]
python = "^3.11"
streamlit = ">=1.46.1,<2.0.0"
streamlit-option-menu = "^0.4.0"
streamlit-elements = "^0.1.0"
streamlit-extras = "^0.4.0"
st-pages = "^0.4.5"
langchain = ">=0.3.26,<0.4.0"
langchain-core = ">=0.3.66,<0.4.0"
langchain-community = ">=0.3.26,<0.4.0"
langchain-ollama = ">=0.3.3,<0.4.0"
langchain-huggingface = ">=0.3.0,<0.4.0"
langchain-openai = ">=0.3.27,<0.4.0"
langchain-google-genai = ">=2.1.6,<3.0.0"
langchain-text-splitters = ">=0.3.8,<0.4.0"
langchain-milvus = ">=0.2.0,<0.3.0"
langgraph = ">=0.5.0,<0.6.0"
faiss-cpu = ">=1.11.0,<2.0.0"
sentence-transformers = ">=4.1.0,<5.0.0"
transformers = ">=4.53.0,<5.0.0"
torch = ">=2.7.1,<3.0.0"
tiktoken = ">=0.9.0,<0.10.0"
pandas = ">=2.3.0,<3.0.0"
numpy = ">=2.3.1,<3.0.0"
matplotlib = ">=3.10.3,<4.0.0"
plotly = ">=6.2.0,<7.0.0"
scikit-learn = ">=1.5.2,<2.0.0"
scipy = "^1.11.4"
scikit-optimize = "^0.10.1"
pyDOE2 = "^1.3.0"
pyomo = "^6.7.0"
altair = "^5.1.2"
seaborn = "^0.12.2"
# macOS인 경우
xgboost = { version = "^3.0.0", markers = "sys_platform == 'darwin'" }
# macOS가 아닌 경우  
xgboost-cpu = { version = "^3.0.0", markers = "sys_platform != 'darwin'" }
catboost = "^1.2.0"
joblib = "^1.4.0"
chromadb = ">=1.0.13,<2.0.0"
pymilvus = ">=2.5.0,<3.0.0"
pypdf = ">=5.6.1,<6.0.0"
pdfplumber = ">=0.11.7,<0.12.0"
python-docx = ">=1.2.0,<2.0.0"
python-pptx = ">=1.0.2,<2.0.0"
python-dotenv = ">=1.1.1,<2.0.0"
tqdm = ">=4.67.1,<5.0.0"
python-louvain = ">=0.16,<0.17"
googlesearch-python = ">=1.2.5,<2.0.0"
beautifulsoup4 = ">=4.12.3,<5.0.0"
lxml = ">=5.3.0,<6.0.0"
urllib3 = ">=2.3.0,<3.0.0"
langfuse = ">=3.1.1,<4.0.0"
deptry = ">=0.23.0,<0.24.0"
ragas = ">=0.2.15,<0.3.0"
datasets = ">=3.6.0,<4.0.0"
fastapi = "^0.112.0"
uvicorn = "^0.30.0"
flask = "^3.0.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.6.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
jinja2 = "^3.1.4"
openpyxl = "^3.1.2"
xlsxwriter = "^3.1.9"
watchdog = "^4.0.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.1.3"
asyncio = "^3.4.3"
aiofiles = "^23.2.1"
pillow = "^10.0.1"
requests = ">=2.32.4,<3.0.0"
typing-extensions = "^4.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.1,<9.0.0"
pytest-asyncio = "^0.21.1"
black = ">=25.1.0,<26.0.0"
flake8 = ">=7.3.0,<8.0.0"
mypy = ">=1.16.1,<2.0.0"
isort = "^5.12.0"
pre-commit = "^3.5.0"
jupyter = ">=1.1.1,<2.0.0"
ipykernel = ">=6.29.5,<7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true 